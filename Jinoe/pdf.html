<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
    <title>PDF Table of Contents</title>
</head>
<body>
    <script>
        // Replace 'path/to/your/document.pdf' with the actual path to your PDF file
        const pdfPath = 's43681-023-00359-5.pdf';

        // Function to extract table of contents
        function extractTableOfContents(pdfPath) {
            // Loading the PDF document
            pdfjsLib.getDocument(pdfPath).promise.then(function(pdf) {
                // Loop through pages
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    // Get text content of each page
                    pdf.getPage(pageNumber).then(function(page) {
                        page.getTextContent().then(function(textContent) {
                            // Extract and display the text content
                            console.log(`Page ${pageNumber}: ${textContent.items.map(item => item.str).join(' ')}`);
                        });
                    });
                }
            });
        }
        // Call the function with the PDF path
        extractTableOfContents(pdfPath);
    </script>
</body>
</html>
